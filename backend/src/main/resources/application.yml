server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: smart-campus-canteen
  datasource:
    url: jdbc:mysql://localhost:3306/campus_canteen?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3s
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

canteen:
  jwt:
    secret: campus-canteen-jwt-secret-key-change-me-in-prod-2026
    expire-hours: 24
  order:
    lock-hours-ahead: 2
    unpaid-expire-minutes: 15
  upload-dir: D:/jdk/canteen-uploads

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.campus.canteen: info
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
